name: Coraline story route QA

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/main/java/com/coraline/feast/**'
      - 'src/gametest/java/com/coraline/feast/**'
      - 'src/wybietest/java/com/coraline/feast/**'
      - 'tools/test_current_story_repairs.py'
      - 'tools/test_story_softlock_fixes_20261122.py'
      - '.github/workflows/coraline-story-route-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

# A route audit can make several quick corrective commits. Run only the
# newest complete candidate, never let obsolete revisions monopolize runners.
concurrency:
  group: coraline-story-route-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-and-forge-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout exact PR revision
        uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Source-level story regressions
        run: python3 tools/test_current_story_repairs.py

      - name: Verify new story-softlock recovery invariants
        run: python3 tools/test_story_softlock_fixes_20261122.py

      - name: Compile and execute actual dependency-free story rules
        shell: bash
        run: |
          mkdir -p build/story-route-qa
          javac --release 17 -d build/story-route-qa \
            src/main/java/com/coraline/feast/FirstEscapeTimeline.java \
            src/main/java/com/coraline/feast/RescueChallengeMath.java \
            src/main/java/com/coraline/feast/RescueWebLayout.java \
            src/main/java/com/coraline/feast/RescueVisionRules.java \
            src/wybietest/java/com/coraline/feast/RescueWebRulesSmoke.java \
            src/wybietest/java/com/coraline/feast/RescueVisionRulesSmoke.java
          java -cp build/story-route-qa com.coraline.feast.RescueWebRulesSmoke
          java -cp build/story-route-qa com.coraline.feast.RescueVisionRulesSmoke

      - name: Compile Forge mod including story-softlock GameTests
        id: forge_compile
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --max-workers=2 \
            '-Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m' \
            -PgameTests -PstorySoftlockTests compileJava

      - name: Install native game/audio build dependencies
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg python3-pil

      - name: Run native Forge GameTest server from production resources
        shell: bash
        timeout-minutes: 35
        run: |
          # Supported QA mode skips expensive master-audio re-imports, not
          # committed sound assets or the actual Forge game-test classes.
          # Gradle emits its authentic launch spec, then exits successfully.
          ./gradlew --no-daemon --max-workers=2 \
            '-Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m' \
            -PgameTests -PstorySoftlockTests -PfreshGameTests -PqaCodeOnlyResources -PexportNativeLaunch runGameTestServer
          test -s build/qa-launch-runGameTestServer.json
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path
          config=json.loads(Path('build/qa-launch-runGameTestServer.json').read_text())
          command=config['command']
          environment={**os.environ,**config.get('environment',{})}
          working=Path(config['cwd'])
          try:
              outcome=subprocess.run(command,cwd=working,env=environment,timeout=480,check=False)
              status=outcome.returncode
          except subprocess.TimeoutExpired:
              print('Native GameTest server exceeded the bounded 480-second execution window',flush=True)
              status=124
          finally:
              for logfile in (working/'logs/latest.log',working/'logs/debug.log'):
                  if logfile.exists():
                      print('--- Native GameTest log: '+str(logfile)+' ---',flush=True)
                      print('\n'.join(logfile.read_text(encoding='utf-8',errors='replace').splitlines()[-160:]),flush=True)
          sys.exit(status)
          PY

      # The 39-case story_softlocks suite checks checkpoint safety. This second
      # independently compiled native suite exercises the actual scene-level
      # First Escape, shoe, tea, Cat, boss and finale interactions and geometry.
      # Exclude the 100+ unrelated Wybie/game-economy suites to keep QA bounded.
      - name: Compile native scene-specific First Escape through dream acceptance tests
        # Continue to the route-specific tests even when an unrelated legacy
        # GameTest (e.g. welcome sequence) fails in the softlock suite.
        # Preserve that earlier failure in the final workflow conclusion.
        if: ${{ !cancelled() && steps.forge_compile.outcome == 'success' }}
        id: scene_compile
        shell: bash
        run: |
          ./gradlew --no-daemon --max-workers=2 \
            '-Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m' \
            -PgameTests -PwybieVisitTests \
            '-PwybieTestClasses=FirstEscapeStoryGameTests.java,MissingParentsTeaGameTests.java,MissingParentsCatGameTests.java,StoryContinuationGameTests.java,RescueBossGameTests.java,RescueCatThrowGameTests.java,RescueTraversalGameTests.java,RescueReunionGameTests.java,RescueVisionGameTests.java,MantisTerrainGameTests.java,RescueAuthoredRatRouteGameTests.java,RescueRatGameTests.java,RescueFinaleInputGameTests.java,ReturnSceneRepairsGameTests.java,RescueHearingGameTests.java,RescueFarewellGateGameTests.java,TheatreLandingRegressionGameTests.java,RescueFoundationsGameTests.java,RescueGhostContinuityGameTests.java,RescuePlaybackGameTests.java,RescueCleanupGameTests.java,RescueKeyMigrationGameTests.java,CurrentStoryRepairsGameTests.java' compileJava

      - name: Run detailed native scene-specific Forge GameTests
        if: ${{ !cancelled() && steps.scene_compile.outcome == 'success' }}
        shell: bash
        timeout-minutes: 35
        run: |
          ./gradlew --no-daemon --max-workers=2 \
            '-Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m' \
            -PgameTests -PwybieVisitTests \
            '-PwybieTestClasses=FirstEscapeStoryGameTests.java,MissingParentsTeaGameTests.java,MissingParentsCatGameTests.java,StoryContinuationGameTests.java,RescueBossGameTests.java,RescueCatThrowGameTests.java,RescueTraversalGameTests.java,RescueReunionGameTests.java,RescueVisionGameTests.java,MantisTerrainGameTests.java,RescueAuthoredRatRouteGameTests.java,RescueRatGameTests.java,RescueFinaleInputGameTests.java,ReturnSceneRepairsGameTests.java,RescueHearingGameTests.java,RescueFarewellGateGameTests.java,TheatreLandingRegressionGameTests.java,RescueFoundationsGameTests.java,RescueGhostContinuityGameTests.java,RescuePlaybackGameTests.java,RescueCleanupGameTests.java,RescueKeyMigrationGameTests.java,CurrentStoryRepairsGameTests.java' \
            -PfreshGameTests -PqaCodeOnlyResources -PexportNativeLaunch runGameTestServer
          test -s build/qa-launch-runGameTestServer.json
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path
          config=json.loads(Path('build/qa-launch-runGameTestServer.json').read_text())
          command=config['command']
          environment={**os.environ,**config.get('environment',{})}
          working=Path(config['cwd'])
          try:
              outcome=subprocess.run(command,cwd=working,env=environment,timeout=600,check=False)
              status=outcome.returncode
          except subprocess.TimeoutExpired:
              print('Detailed story GameTest exceeded its bounded 600-second window',flush=True)
              status=124
          finally:
              for logfile in (working/'logs/latest.log',working/'logs/debug.log'):
                  if logfile.exists():
                      print('--- Detailed GameTest log: '+str(logfile)+' ---',flush=True)
                      lines=logfile.read_text(encoding='utf-8',errors='replace').splitlines()
                      print('\n'.join(lines[-240:]),flush=True)
          sys.exit(status)
          PY
