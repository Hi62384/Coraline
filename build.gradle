plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

// Keep long-running activity GameTests independent of other builds in this checkout.
if (project.hasProperty('isolatedActivityBuild')) {
    layout.buildDirectory.set(layout.projectDirectory.dir(project.hasProperty('characterCastBuild') ? 'build-character-cast' : 'build-activity'))
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Mojang ships Java 17 to end users in 1.18+, so your mod should target Java 17.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"
minecraft {
    // The mappings can be changed at any time and must be in the following format.
    // Channel:   Version:
    // official   MCVersion             Official field/method names from Mojang mapping files
    // parchment  YYYY.MM.DD-MCVersion  Open community-sourced parameter names and javadocs layered on top of official
    //
    // You must be aware of the Mojang license when using the 'official' or 'parchment' mappings.
    // See more information here: https://github.com/MinecraftForge/MCPConfig/blob/master/Mojang.md
    //
    // Parchment is an unofficial project maintained by ParchmentMC, separate from MinecraftForge
    // Additional setup is needed to use their mappings: https://parchmentmc.org/docs/getting-started
    //
    // Use non-default mappings at your own risk. They may not always work.
    // Simply re-run your setup task after changing the mappings to update your workspace.
    mappings channel: mapping_channel, version: mapping_version

    // When true, this property will have all Eclipse/IntelliJ IDEA run configurations run the "prepareX" task for the given run configuration before launching the game.
    // In most cases, it is not necessary to enable.
    // enableEclipsePrepareRuns = true
    // enableIdeaPrepareRuns = true

    // This property allows configuring Gradle's ProcessResources task(s) to run on IDE output locations before launching the game.
    // It is REQUIRED to be set to true for this template to function.
    // See https://docs.gradle.org/current/dsl/org.gradle.language.jvm.tasks.ProcessResources.html
    copyIdeResources = true

    // When true, this property will add the folder name of all declared run configurations to generated IDE run configurations.
    // The folder name can be set on a run configuration using the "folderName" property.
    // By default, the folder name of a run configuration is the name of the Gradle project containing it.
    // generateRunFolders = true

    // This property enables access transformers for use in development.
    // They will be applied to the Minecraft artifact.
    // The access transformer file can be anywhere in the project.
    // However, it must be at "META-INF/accesstransformer.cfg" in the final mod jar to be loaded by Forge.
    // This default location is a best practice to automatically put the file in the right place in the final jar.
    // See https://docs.minecraftforge.net/en/latest/advanced/accesstransformers/ for more information.
    // accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        // applies to all the run configs below
        configureEach {
            args '-mixin.config', 'coraline.mixins.json', '-mixin.config', 'coraline.party.mixins.json'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${layout.buildDirectory.get().asFile}/createSrgToMcp/output.srg"
            workingDirectory project.file('run')

            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            property 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            if (project.hasProperty('visitEventsVisualCheck')) {
                property 'coraline.visitEventsVisualCheck', 'true'
                workingDirectory project.file('run-wybie-visit-qa')
                args '--quickPlaySingleplayer', 'WybieVisitQA'
            }
            if (project.hasProperty('seamlessTunnelVisualCheck')) {
                property 'coraline.seamlessTunnelVisualCheck', 'true'
                workingDirectory project.file('run-wybie-visit-qa')
                args '--quickPlaySingleplayer', 'WybieVisitQA'
            }
            if (project.hasProperty('rosewoodHouseVisualCheck')) {
                property 'coraline.rosewoodHouseVisualCheck', 'true'
                if (project.hasProperty('storageOnlyVisualCheck')) property 'coraline.storageOnlyVisualCheck', 'true'
                workingDirectory project.file('run-wybie-visit-qa')
                args '--quickPlaySingleplayer', 'WybieVisitQA'
            }
            if (project.hasProperty('storyVisitsVisualCheck')) {
                property 'coraline.storyVisitsVisualCheck', 'true'
                if (project.hasProperty('storyVisitsFinishCheck')) property 'coraline.storyVisitsFinishCheck', 'true'
                if (project.hasProperty('storyVisitsTeaOnly')) property 'coraline.storyVisitsTeaOnly', 'true'
                workingDirectory project.file('run-story-visits-qa')
                args '--quickPlaySingleplayer', 'StoryVisitsQA'
            }
            if (project.hasProperty('wybieVisitVisualCheck')) {
                property 'coraline.wybieVisitVisualCheck', 'true'
                if (project.hasProperty('wybieVisitPoseOnly')) property 'coraline.wybieVisitPoseOnly', 'true'
                workingDirectory project.file('run-wybie-visit-qa')
                args '--quickPlaySingleplayer', 'WybieVisitQA'
            }
            if (project.hasProperty('scoldingAudioCheck')) {
                property 'coraline.scoldingAudioCheck', 'true'
                if (project.hasProperty('scoldingFlowStart')) property 'coraline.scoldingFlowStart', project.property('scoldingFlowStart')
                workingDirectory project.file('run-new-activities')
                if (project.file('run-new-activities/saves/CoralineActivitiesQA/level.dat').isFile()) {
                    args '--quickPlaySingleplayer', 'CoralineActivitiesQA'
                }
            }
            if (project.hasProperty('secretsAudioCheck')) {
                property 'coraline.secretsAudioCheck', 'true'
                if (project.hasProperty('secretsUiCheck')) property 'coraline.secretsUiCheck', 'true'
                workingDirectory project.file('run-new-activities')
                if (project.file('run-new-activities/saves/CoralineActivitiesQA/level.dat').isFile()) {
                    args '--quickPlaySingleplayer', 'CoralineActivitiesQA'
                }
            }
            if (project.hasProperty('secretsVisualCheck')) {
                property 'coraline.secretsVisualCheck', 'true'
                workingDirectory project.file('run-new-activities')
                if (project.file('run-new-activities/saves/CoralineActivitiesQA/level.dat').isFile()) {
                    args '--quickPlaySingleplayer', 'CoralineActivitiesQA'
                }
            }
            if (project.hasProperty('dropperVisualCheck')) {
                property 'coraline.dropperVisualCheck', 'true'
                if (project.hasProperty('dropperOnly')) property 'coraline.dropperOnly', 'true'
                property 'coraline.revisionVisualCheck', 'true'
                workingDirectory project.file('run-new-activities')
                if (project.file('run-new-activities/saves/CoralineActivitiesQA/level.dat').isFile()) {
                    args '--quickPlaySingleplayer', 'CoralineActivitiesQA'
                }
            }
            if (project.hasProperty('activityRevisionVisualCheck')) {
                property 'coraline.activityRevisionVisualCheck', 'true'
                property 'coraline.revisionVisualCheck', 'true'
                workingDirectory project.file('run-new-activities')
                if (project.file('run-new-activities/saves/CoralineActivitiesQA/level.dat').isFile()) {
                    args '--quickPlaySingleplayer', 'CoralineActivitiesQA'
                }
            }
            if (project.hasProperty('visitGiftVisualCheck')) {
                property 'coraline.visitGiftVisualCheck', 'true'
                property 'coraline.revisionVisualCheck', 'true'
                workingDirectory project.file('run-new-activities')
                if (project.file('run-new-activities/saves/CoralineActivitiesQA/level.dat').isFile()) {
                    args '--quickPlaySingleplayer', 'CoralineActivitiesQA'
                }
            }
            if (project.hasProperty('revisionVisualCheck')) {
                property 'coraline.revisionVisualCheck', 'true'
                if (project.hasProperty('introFortressVisualCheck')) property 'coraline.introFortressVisualCheck', 'true'
                workingDirectory project.file('run-new-activities')
                if (project.file('run-new-activities/saves/CoralineActivitiesQA/level.dat').isFile()) {
                    args '--quickPlaySingleplayer', 'CoralineActivitiesQA'
                }
            }
            if (project.hasProperty('mallBattleHuntVisualCheck')) {
                property 'coraline.mallBattleHuntVisualCheck', 'true'
                if (project.hasProperty('snowBattleOnly')) property 'coraline.snowBattleOnly', 'true'
                workingDirectory project.file('run-new-activities')
                if (project.file('run-new-activities/saves/CoralineActivitiesQA/level.dat').isFile()) {
                    args '--quickPlaySingleplayer', 'CoralineActivitiesQA'
                }
            }
            if (project.hasProperty('expeditionVisualCheck')) {
                property 'coraline.expeditionVisualCheck', 'true'
                workingDirectory project.file('run-new-activities')
                if (project.file('run-new-activities/saves/CoralineActivitiesQA/level.dat').isFile()) {
                    args '--quickPlaySingleplayer', 'CoralineActivitiesQA'
                }
            }
            if (project.hasProperty('newActivitiesVisualCheck')) {
                property 'coraline.newActivitiesVisualCheck', 'true'
                workingDirectory project.file('run-new-activities')
                if (project.file('run-new-activities/saves/CoralineActivitiesQA/level.dat').isFile()) {
                    args '--quickPlaySingleplayer', 'CoralineActivitiesQA'
                }
            }
            if (project.hasProperty('storyPresentationCheck')) {
                property 'coraline.storyPresentationCheck', 'true'
                args '--quickPlaySingleplayer', 'CoralineVisualQA170'
            }
            if (project.hasProperty('clothingVisualCheck')) {
                property 'coraline.clothingVisualCheck', 'true'
                if (project.hasProperty('referenceArmorOnly')) property 'coraline.referenceArmorOnly', 'true'
                if (project.hasProperty('effectsOnly')) property 'coraline.effectsOnly', 'true'
                args '--quickPlaySingleplayer', 'CoralineVisualQA170'
            }
            if (project.hasProperty('feastVisualCheck')) {
                property 'coraline.feastVisualCheck', 'true'
                args '--quickPlaySingleplayer', 'CoralineVisualQA170'
            }
            if (project.hasProperty('worldVisualCheck')) {
                property 'coraline.worldVisualCheck', 'true'
                args '--quickPlaySingleplayer', 'CoralineVisualQA170'
            }
            if (project.hasProperty('villageVisualCheck')) {
                property 'coraline.villageVisualCheck', 'true'
                args '--quickPlaySingleplayer', 'CoralineVisualQA170'
            }
            if (project.hasProperty('archeryVisualCheck')) {
                property 'coraline.archeryVisualCheck', 'true'
                args '--quickPlaySingleplayer', 'CoralineVisualQA170'
            }
            if (project.hasProperty('cakeVisualCheck')) {
                property 'coraline.cakeVisualCheck', 'true'
                args '--quickPlaySingleplayer', 'CoralineVisualQA170'
            }
            if (project.hasProperty('carnivalVisualCheck')) {
                property 'coraline.carnivalVisualCheck', 'true'
                args '--quickPlaySingleplayer', 'CoralineVisualQA170'
            }
            if (project.hasProperty('dreamParkourVisualCheck')) {
                property 'coraline.dreamParkourVisualCheck', 'true'
                args '--quickPlaySingleplayer', (project.findProperty('dreamParkourWorld') ?: 'CoralineDreamQA2')
            }
            if (project.hasProperty('fishingVisualCheck')) {
                property 'coraline.fishingVisualCheck', 'true'
                args '--quickPlaySingleplayer', (project.findProperty('fishingWorld') ?: 'CoralineFishingQA1')
            }
            if (project.hasProperty('gardenMazeVisualCheck')) {
                property 'coraline.gardenMazeVisualCheck', 'true'
                args '--quickPlaySingleplayer', (project.findProperty('gardenMazeWorld') ?: 'CoralineVisualQA170')
            }
            if (project.hasProperty('grandFeastVisualCheck')) {
                property 'coraline.grandFeastVisualCheck', 'true'
                args '--quickPlaySingleplayer', (project.findProperty('grandFeastWorld') ?: 'CoralineVisualQA170')
            }
            if (project.hasProperty('iceBoatRaceVisualCheck')) {
                property 'coraline.iceBoatRaceVisualCheck', 'true'
                args '--quickPlaySingleplayer', (project.findProperty('iceBoatRaceWorld') ?: 'CoralineVisualQA170')
            }
            if (project.hasProperty('magicActivitiesVisualCheck')) {
                property 'coraline.magicActivitiesVisualCheck', 'true'
                args '--quickPlaySingleplayer', (project.findProperty('magicActivitiesWorld') ?: 'CoralineVisualQA170')
            }
            if (project.hasProperty('debugVisitCheck')) {
                property 'coraline.debugVisitCheck', 'true'
                args '--quickPlaySingleplayer', 'CoralineVisualQA170'
            }
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            if (project.hasProperty('freshGameTests')) workingDirectory project.file('run-tests-' + System.currentTimeMillis())
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            // example of overriding the workingDirectory set in configureEach above
            workingDirectory project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

// Opt-in regression worlds are excluded from release jars.
if (project.hasProperty('gameTests')) {
    if (project.hasProperty('visitGiftTests')) { sourceSets.main.java.srcDir 'src/visittest/java'; sourceSets.main.java.srcDir 'src/gametest/java/com/coraline/welcome' }
    sourceSets.main.java.srcDir project.hasProperty('wybieVisitTests') ? 'src/wybietest/java' : project.hasProperty('secretsTests') ? 'src/activitytest/java/com/coraline/secrets' : project.hasProperty('activityFixTests') ? 'src/activitytest/java' : project.hasProperty('welcomeTests') ? 'src/gametest/java/com/coraline/welcome' : project.hasProperty('familyResetTests') ? 'src/gametest/java/com/coraline/reset' : project.hasProperty('clothingTests') ? 'src/gametest/java/com/coraline/clothing' : 'src/gametest/java'
    sourceSets.main.resources.srcDir 'src/gametest/resources'
    if (project.hasProperty('parentTests')) sourceSets.main.java.srcDir 'src/gametest/java/com/coraline/parents'
    if (project.hasProperty('wybieTestClass')) sourceSets.main.java.exclude { element ->
        !element.directory && element.file.absolutePath.replace('\\','/').contains('/src/wybietest/') && element.file.name.endsWith('GameTests.java') && element.file.name != project.property('wybieTestClass')
    }
    if (project.hasProperty('wybieTestClasses')) {
        def selectedTests = new HashSet(Arrays.asList(project.property('wybieTestClasses').toString().split(',')))
        if (selectedTests.isEmpty() || selectedTests.any { !(it ==~ /[A-Za-z0-9_]+GameTests\.java/) })
            throw new GradleException('Invalid bounded GameTest class selection')
        sourceSets.main.java.exclude { element ->
            !element.directory && element.file.absolutePath.replace('\\','/').contains('/src/wybietest/') && element.file.name.endsWith('GameTests.java') && !selectedTests.contains(element.file.name)
        }
    }
}
if (project.hasProperty('gameTests')) sourceSets.main.java.srcDir 'src/rendercheck/java/com/coraline/qa'
if (project.hasProperty('renderChecks')) {
    if (project.hasProperty('rosewoodHouseVisualCheck') || project.hasProperty('seamlessTunnelVisualCheck') || project.hasProperty('visitEventsVisualCheck')) sourceSets.main.java.exclude 'com/coraline/client/DollRenderCheck.java'
    sourceSets.main.java.srcDir 'src/rendercheck/java'
    if (project.hasProperty('renderCheckClasses')) {
        def selectedRender = new HashSet(Arrays.asList(project.property('renderCheckClasses').toString().split(',')))
        if (selectedRender.isEmpty() || selectedRender.any { !(it ==~ /[A-Za-z0-9_]+VisualCheck\.java/) }) throw new GradleException('Invalid render harness selection')
        sourceSets.main.java.exclude { element -> !element.directory && element.file.absolutePath.replace('\\','/').contains('/src/rendercheck/') && !selectedRender.contains(element.file.name) && element.file.name != 'LeanWorldVisualCheck.java' }
    }
    if (project.hasProperty('storyVisitsVisualCheck') || project.hasProperty('wybieVisitVisualCheck') || project.hasProperty('iceBoatRaceVisualCheck') || project.hasProperty('magicActivitiesVisualCheck') || project.hasProperty('newActivitiesVisualCheck') || project.hasProperty('expeditionVisualCheck') || project.hasProperty('mallBattleHuntVisualCheck')) sourceSets.main.java.exclude 'com/coraline/client/DollRenderCheck.java'
}

tasks.register('importParentVoices', Exec) {
    onlyIf {
        fileTree('voicelines').files.any { f ->
            f.name.toLowerCase() ==~ /^(angryparent|mom|mother|dad|father|parent).*\.(wav|ogg|mp3|flac|m4a)$/ ||
            f.parentFile.name.toLowerCase() in ['mom','mother','dad','father']
        }
    }
    commandLine 'python', 'tools/import_parent_voices.py'
}
tasks.named('processResources').configure { dependsOn 'importParentVoices' }
tasks.register('importWybieVisitAudio', Exec) {
    commandLine 'python', 'tools/import_wybie_visit_audio.py'
}
tasks.named('processResources').configure { dependsOn 'importWybieVisitAudio' }

// Original supplied WAVs only; no synthesis/transcription or subtitle changes.
tasks.register('importFinalChapterRecordings', Exec) {
    commandLine 'python', 'tools/import_final_chapter_recordings.py'
}
tasks.named('processResources').configure { dependsOn 'importFinalChapterRecordings' }
tasks.register('checkFinalChapterRecordings', Exec) {
    dependsOn 'importFinalChapterRecordings'
    commandLine 'python', 'tools/verify_final_chapter_recordings.py'
}
tasks.register('testFinalChapterRecordingMerge', Exec) {
    commandLine 'python', 'tools/test_final_chapter_recordings.py'
}
tasks.named('check').configure { dependsOn 'checkFinalChapterRecordings', 'testFinalChapterRecordingMerge' }
// Shared sound/timing tables must be merged after the existing importers.
gradle.projectsEvaluated {
    tasks.named('importFinalChapterRecordings').configure {
        mustRunAfter tasks.matching { it.name.startsWith('import') && it.name != 'importFinalChapterRecordings' }
    }
}
tasks.register('buildVisitVoiceEnvelopes', Exec) {
    dependsOn 'importWybieVisitAudio'
    inputs.file 'tools/build_visit_envelopes.py'
    inputs.files fileTree('src/main/resources/assets/coraline/sounds/wybie_visit') { include '*.ogg'; exclude 'music.ogg' }
    inputs.files fileTree('src/main/resources/assets/coraline/sounds/bobinsky_visit') { include '*.ogg'; exclude 'music.ogg' }
    outputs.file 'src/main/resources/assets/coraline/visit_voice_envelopes.json'
    commandLine 'python', 'tools/build_visit_envelopes.py'
}
tasks.named('processResources').configure { dependsOn 'buildVisitVoiceEnvelopes' }

tasks.register('buildFinalChapterEnvelopes', Exec) {
    dependsOn 'importFinalChapterRecordings', 'buildVisitVoiceEnvelopes'
    // Merge supplied-recording waveform data last; never synthesize or caption.
    commandLine 'python', 'tools/build_final_chapter_envelopes.py'
}
tasks.named('processResources').configure { dependsOn 'buildFinalChapterEnvelopes' }
tasks.named('checkFinalChapterRecordings').configure { dependsOn 'buildFinalChapterEnvelopes' }
tasks.register('testFinalChapterEnvelopes', Exec) {
    commandLine 'python', 'tools/test_final_chapter_envelopes.py'
}
tasks.named('check').configure { dependsOn 'testFinalChapterEnvelopes' }
tasks.register('importRosewoodHouse', Exec) {
    commandLine 'python', 'tools/import_rosewood_house.py'
    inputs.file 'tools/import_rosewood_house.py'
    inputs.file 'tools/repair_rosewood_house.py'
    inputs.file 'tools/build_rosewood_fixtures.py'
    inputs.file 'artwork/otherworld_house/Rosewood_House_Complete_v3.blueprint.json'
    outputs.file 'src/main/resources/assets/coraline/structures/rosewood_house.json.gz'
    outputs.files fileTree('src/main/resources/assets/coraline/models/block') { include 'rosewood_*.json' }
    outputs.files fileTree('src/main/resources/assets/coraline/blockstates') { include 'rosewood_*.json' }
    outputs.files 'src/main/resources/assets/coraline/textures/block/rosewood_drawer.png', 'src/main/resources/assets/coraline/textures/block/rosewood_cabinet.png', 'src/main/resources/assets/coraline/textures/item/borrowed_house_key.png', 'src/main/resources/assets/coraline/models/item/borrowed_house_key.json'
}
tasks.named('processResources').configure { dependsOn 'importRosewoodHouse' }
tasks.register('importRosewoodGarden', Exec) {
    commandLine 'python', 'tools/import_rosewood_garden.py'
    inputs.files 'tools/import_rosewood_garden.py', 'artwork/otherworld_garden/Rosewood_Moonlit_Garden.blueprint.json'
    outputs.file 'src/main/resources/assets/coraline/structures/rosewood_garden.json.gz'
}
tasks.named('processResources').configure { dependsOn 'importRosewoodGarden' }
tasks.matching { it.name == 'validateModelJson' }.configureEach { dependsOn 'importRosewoodHouse' }
tasks.register('importGameAudio', Exec) {
    dependsOn 'importParentVoices'
    commandLine 'python', 'tools/import_game_audio.py'
}
tasks.named('processResources').configure { dependsOn 'importGameAudio' }

tasks.register('importFirstEscapeMusic', Exec) {
    commandLine 'python', 'tools/import_first_escape_music.py'
    inputs.files 'tools/import_first_escape_music.py', 'music/eventbased/FirstEscape.mp3'
    outputs.files 'src/main/resources/assets/coraline/sounds/scenes/first_escape_music.ogg', 'src/main/resources/assets/coraline/first_escape_music_audio.json'
}
tasks.named('processResources').configure { dependsOn 'importFirstEscapeMusic' }
tasks.register('importVisitAudio', Exec) {
    dependsOn 'importGameAudio'
    commandLine 'python', 'tools/import_visit_audio.py'
}
tasks.named('processResources').configure { dependsOn 'importVisitAudio' }

tasks.register('importLegacyOriginalMetadata', Exec) {
    dependsOn 'importVisitAudio', 'importWybieVisitAudio'
    inputs.files 'tools/import_legacy_original_metadata.py', 'tools/legacy_original_recordings.json'
    // Merge after the original exporters; never reset another importer's times.
    commandLine 'python', 'tools/import_legacy_original_metadata.py'
}
tasks.named('processResources').configure { dependsOn 'importLegacyOriginalMetadata' }

tasks.register('importVisitEventAudio', Exec) {
    dependsOn 'importScoldingAudio', 'importWybieVisitAudio'
    inputs.files(fileTree('voicelines/othermother/events'), fileTree('voicelines/otherfather/events'))
    inputs.files('tools/prepare_exploration_audio.py','tools/visit_event_audio_catalog.py','tools/voice_recording_proof.py')
    inputs.file 'tools/prepare_temporary_event_audio.py'
    inputs.files('tools/compact_event_voice_plan.json','tools/full_event_voice_plan.json')
    inputs.property 'temporaryEventAudio', project.hasProperty('temporaryEventAudio')
    inputs.files(fileTree('tools') { include '*_voice_manifest.json' })
    outputs.dir 'src/main/resources/assets/coraline/sounds/exploration'
    outputs.dir 'src/main/resources/assets/coraline/sounds/family_dinner'
    outputs.dir 'src/main/resources/assets/coraline/sounds/study'
    outputs.dir 'src/main/resources/assets/coraline/sounds/family_outing'
    outputs.dir 'src/main/resources/assets/coraline/sounds/family_game_night'
    outputs.dir 'src/main/resources/assets/coraline/sounds/special_delivery'
    outputs.dir 'src/main/resources/assets/coraline/sounds/house_party'
    outputs.dir 'src/main/resources/assets/coraline/sounds/player_party'
    outputs.dir 'src/main/resources/assets/coraline/sounds/mother_goes_out'
    outputs.dir 'src/main/resources/assets/coraline/sounds/wybie_adventure'
    outputs.dir 'src/main/resources/assets/coraline/sounds/theatre'
    outputs.dir 'src/main/resources/assets/coraline/sounds/mouse_circus'
    outputs.dir 'src/main/resources/assets/coraline/sounds/compact_events'
    if (project.hasProperty('temporaryEventAudio')) {
        commandLine 'python', 'tools/prepare_temporary_event_audio.py'
    } else {
        commandLine 'python', 'tools/prepare_exploration_audio.py', '--all'
    }
}
tasks.named('processResources').configure { dependsOn 'importVisitEventAudio' }
tasks.matching { it.name == 'buildStorySubtitles' }.configureEach { dependsOn 'importVisitEventAudio' }

tasks.register('importWelcomeAudio', Exec) {
    dependsOn 'importVisitAudio'
    commandLine 'python', 'tools/import_welcome_audio.py'
}
tasks.named('processResources').configure { dependsOn 'importWelcomeAudio' }
tasks.register('importLootAudio', Exec) {
    dependsOn 'importWelcomeAudio'
    environment 'CORALINE_VOICE_MANIFEST', 'tools/other_mother_loot.json'
    commandLine 'python', 'tools/import_welcome_audio.py'
}
tasks.named('processResources').configure { dependsOn 'importLootAudio' }
tasks.register('importVisitGiftAudio', Exec) {
    dependsOn 'importLootAudio'
    environment 'CORALINE_VOICE_MANIFEST', 'tools/other_mother_visit_gifts.json'
