// Complete the same audio task graph serially without retaining Gradle beside
// each decoder. A receipt is accepted only for the exact graph and unchanged
// masters, scripts, captions and imported outputs. Resource optimization and
// all release checks still execute normally.
def serializedAudioTask = { task -> task instanceof Exec && (
    (task.name.startsWith('import') && !(task.name in ['importRosewoodHouse','importRosewoodGarden'])) ||
    task.name in ['buildVisitVoiceEnvelopes','buildFinalChapterEnvelopes','buildStorySubtitles']) }
if (project.hasProperty('exportSerializedImports') || project.hasProperty('preparedSerializedImports')) {
    if (project.hasProperty('temporaryEventAudio') || project.hasProperty('qaCodeOnlyResources'))
        throw new GradleException('Serialized release imports require genuine audio.')
    gradle.taskGraph.whenReady { graph ->
        def rows = graph.allTasks.findAll(serializedAudioTask).collect { task ->
            [name:task.name, command:task.commandLine.collect { it.toString() },
             environment:task.environment.findAll { key,value -> key == 'CORALINE_VOICE_MANIFEST' }.collectEntries { key,value -> [(key.toString()):value.toString()] }]
        }
        if (rows.isEmpty()) throw new GradleException('No complete audio import graph.')
        def checkedPath = { value ->
            def path=project.file(value).canonicalFile
            if (!path.toPath().startsWith(layout.buildDirectory.get().asFile.canonicalFile.toPath()))
                throw new GradleException('Serialized import receipt escaped this build.')
            path
        }
        if (project.hasProperty('exportSerializedImports')) {
            def output=checkedPath(project.property('exportSerializedImports'))
            output.parentFile.mkdirs()
            def compiler=tasks.named('compileJava', JavaCompile).get()
            def compileSpec=[sources:compiler.source.files.collect { it.canonicalPath }.sort(),
                classpath:compiler.classpath.files.collect { it.canonicalPath },
                processors:compiler.options.annotationProcessorPath.files.collect { it.canonicalPath },
                arguments:compiler.options.compilerArgs.collect { it.toString() },
                sourceCompatibility:compiler.sourceCompatibility, targetCompatibility:compiler.targetCompatibility,
                destination:compiler.destinationDirectory.get().asFile.canonicalPath]
            output.text=groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([format:1,version:mod_version,tasks:rows,compile:compileSpec]))
            throw new GradleException('SERIALIZED_IMPORT_GRAPH_EXPORTED: no build tasks executed')
        }
        def receipt=checkedPath(project.property('preparedSerializedImports'))
        def proof=new groovy.json.JsonSlurper().parse(receipt)
        if (proof.status != 'passed' || proof.graph.tasks != rows || proof.graph.version != mod_version)
            throw new GradleException('Serialized import graph/version does not match this release.')
        project.exec { commandLine 'python','tools/serialized_release_imports.py','verify','--receipt',receipt.absolutePath }
        graph.allTasks.findAll(serializedAudioTask).each { task -> task.onlyIf { false } }
    }
}

