// Example for how to get properties into the manifest for reading at runtime.
tasks.named('jar', Jar).configure {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    if (project.hasProperty('temporaryEventAudio')) archiveClassifier.set('placeholder-audio')
    else {
        // Keep the archived placeholder inventory/cues in source, but never
        // advertise or package them as part of a complete genuine-voice build.
        exclude 'assets/coraline/temporary_event_audio.json'
        exclude 'assets/coraline/sounds/temporary_event_audio/**'
    }
    // Copy tasks can retain this opt-in fixture after a GameTest build. It has
    // no runtime role and must not leak into a subsequent production release.
    if (!project.hasProperty('gameTests')) exclude 'data/coraline/structures/empty.nbt'
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                  'Audio-Build-Kind'         : project.hasProperty('temporaryEventAudio') ? 'placeholder-audio' : 'genuine-audio',
                'MixinConfigs'            : 'coraline.mixins.json,coraline.party.mixins.json',
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1', // We are version 1 of ourselves
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors
        ])
    }

    // This is the preferred method to reobfuscate your jar file
    finalizedBy 'reobfJar'
}

