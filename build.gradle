        'importFirstEscapeMusic','importVisitAudio','importLegacyOriginalMetadata',
        'importVisitEventAudio','importNumberedOriginalAudio','importBlackIsTraditionalAudio',
        'importFirstEscapeAudio','importMissingParentsTeaAudio','importMissingParentsMusic',
        'importRescueChaptersAudio','importIncidentalDialogueAudio','importAcceptedGhostAudio',
        // These remaining master-audio importers also run on a normal
        // processResources task. QA must use pinned, committed runtime OGGs;
        // an absent or changed source master cannot block a native GameTest.
        'importGhostVictimAudio','importOtherFatherBossMusic','importLongFaceMusic',
        'importTheCatMusic','importRescueArrivalMusic','importGameProposalMusic',
        'importSpinkBossMusic','importGhostEyeMusic',
        'buildStorySubtitles'
    ] }.configureEach { enabled = false }
    gradle.taskGraph.whenReady { graph ->
        if (graph.allTasks.any { it.name in ['jar','reobfJar','build','assemble','publish'] }) {
            throw new GradleException('Code-only QA resources cannot produce a release artifact.')
