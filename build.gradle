// Opt-in QA preparation: release compiler memory before starting Minecraft.
// Export the actual ForgeGradle launch spec, never an invented launch command.
abstract class CoralineQaRunExporter extends net.minecraftforge.gradle.common.util.runs.RunConfigGenerator {
    static Map prepare(def task) {
        // Mirror MinecraftRunTask.exec's configuration using the same token/arg
        // generators. JavaExec itself is deliberately not invoked here.
        def cfg=task.runConfig.get()
        def tokens=configureTokensLazy(task.project,cfg,mapModClassesToGradle(task.project,cfg),task.minecraftArtifacts,task.runtimeClasspathArtifacts)
        task.workingDir=task.project.file(cfg.workingDirectory)
        task.workingDir.mkdirs()
        task.args(getArgsStream(cfg,tokens,false).toArray())
        cfg.jvmArgs.each { task.jvmArgs(cfg.replace(tokens,it)) }
        if (cfg.isClient()) task.additionalClientArgs.get().each { task.jvmArgs(cfg.replace(tokens,it)) }
        cfg.environment.each { key,value -> task.environment(key,cfg.replace(tokens,value)) }
        cfg.properties.each { key,value -> task.systemProperty(key,cfg.replace(tokens,value)) }
        cfg.allSources.each { task.classpath(it.runtimeClasspath) }
        task.executable=task.javaLauncher.get().executablePath.asFile.absolutePath
        // Gradle 8.8's new JVM-arguments property is materialized only inside
        // JavaExec.exec; getAllJvmArgs alone omits Forge's module/open options.
        def pendingJvm=task.jvmArguments.getOrElse([])
        def providerJvm=task.jvmArgumentProviders.collectMany { it.asArguments().toList() }
        return [command: [task.executable]+task.allJvmArgs+pendingJvm+providerJvm+['-cp',task.classpath.asPath,task.mainClass.get()]+task.args,
                cwd:task.workingDir.absolutePath, environment:task.environment]
    }
}
if (project.hasProperty('exportNativeLaunch')) {
    tasks.matching { it.name in ['runClient', 'runGameTestServer'] }.configureEach {
        doFirst {
            def launchFile=layout.buildDirectory.file('qa-launch-' + name + '.json').get().asFile
            launchFile.parentFile.mkdirs()
            launchFile.text=groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(CoralineQaRunExporter.prepare(delegate)))
            logger.lifecycle('Prepared native launch: ' + launchFile.absolutePath)
            throw new org.gradle.api.tasks.StopExecutionException('Prepared only; native process runs after Gradle exits')
        }
    }
}

