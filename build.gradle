tasks.named('compileJava', JavaCompile).configure {
    // Opt-in test sources share main output. Force a full compilation when switching
    // source sets; incremental annotation processing can otherwise remove test classes.
    // Mixin emits one shared refmap and shadow mapping file for the compilation.
    // Incremental compilation can silently leave either output incomplete.
    options.incremental = false
    // The guarded low-memory source build releases compiler state with this
    // worker instead of retaining the full mapped classpath in Gradle. Mixin
    // processing and its declared outputs remain part of the same real task.
    if (project.hasProperty('isolatedLowMemoryCompiler')) {
        options.fork = true
        options.forkOptions.memoryInitialSize = '16m'
        options.forkOptions.memoryMaximumSize = '256m'
        options.forkOptions.jvmArgs += ['-XX:+UseSerialGC', '-XX:ActiveProcessorCount=2',
            '-XX:MaxMetaspaceSize=128m', '-XX:ReservedCodeCacheSize=32m', '-XX:MaxDirectMemorySize=48m']
    }
    dependsOn 'clothingSrgMappings'
    outputs.files(clothingRefmap, mixinShadowMappings)
    doFirst { clothingRefmap.get().asFile.parentFile.mkdirs() }
    options.compilerArgs += [
        '-AdefaultObfuscationEnv=searge',
        "-AreobfSrgFile=${clothingMappings.get().asFile}",
        "-AoutRefMapFile=${clothingRefmap.get().asFile}",
        "-AoutSrgFile=${mixinShadowMappings.get().asFile}"
    ]
}

// Shadows belong to the mixin class, not Minecraft's inheritance tree. The
// normal game mappings cannot rename them without the annotation processor's
// supplemental mappings. Refmaps alone only cover injections/accessors.
tasks.withType(net.minecraftforge.gradle.userdev.tasks.RenameJarInPlace).configureEach {
    if (name == 'reobfJar') {
        if (project.hasProperty('compactSingleRelease')) {
            // Keep the Gradle owner at 192 MiB while its one serial Forge
            // remapper retains the existing 384 MiB cap. No second daemon.
            jvmArgs.addAll('-Xms16m', '-Xmx384m', '-XX:+UseSerialGC',
                '-XX:ActiveProcessorCount=2', '-XX:MaxMetaspaceSize=128m',
                '-XX:ReservedCodeCacheSize=32m', '-XX:MaxDirectMemorySize=48m',
                '-Djdk.nio.maxCachedBufferSize=1048576')
        }
        dependsOn 'compileJava'
        extraMappings.from(mixinShadowMappings)
        doLast {
            project.exec {
                commandLine 'python', 'tools/verify_packaged_mixins.py', input.get().asFile.absolutePath
            }
        }
    }
}
