plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

// Keep long-running activity GameTests independent of other builds in this checkout.
if (project.hasProperty('isolatedActivityBuild')) {
    layout.buildDirectory.set(layout.projectDirectory.dir('build-activity'))
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Mojang ships Java 17 to end users in 1.18+, so your mod should target Java 17.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"
minecraft {
    // The mappings can be changed at any time and must be in the following format.
    // Channel:   Version:
    // official   MCVersion             Official field/method names from Mojang mapping files
    // parchment  YYYY.MM.DD-MCVersion  Open community-sourced parameter names and javadocs layered on top of official
    //
    // You must be aware of the Mojang license when using the 'official' or 'parchment' mappings.
    // See more information here: https://github.com/MinecraftForge/MCPConfig/blob/master/Mojang.md
    //
    // Parchment is an unofficial project maintained by ParchmentMC, separate from MinecraftForge
    // Additional setup is needed to use their mappings: https://parchmentmc.org/docs/getting-started
    //
    // Use non-default mappings at your own risk. They may not always work.
    // Simply re-run your setup task after changing the mappings to update your workspace.
    mappings channel: mapping_channel, version: mapping_version

    // When true, this property will have all Eclipse/IntelliJ IDEA run configurations run the "prepareX" task for the given run configuration before launching the game.
    // In most cases, it is not necessary to enable.
    // enableEclipsePrepareRuns = true
    // enableIdeaPrepareRuns = true

    // This property allows configuring Gradle's ProcessResources task(s) to run on IDE output locations before launching the game.
    // It is REQUIRED to be set to true for this template to function.
    // See https://docs.gradle.org/current/dsl/org.gradle.language.jvm.tasks.ProcessResources.html
    copyIdeResources = true

    // When true, this property will add the folder name of all declared run configurations to generated IDE run configurations.
    // The folder name can be set on a run configuration using the "folderName" property.
    // By default, the folder name of a run configuration is the name of the Gradle project containing it.
    // generateRunFolders = true

    // This property enables access transformers for use in development.
    // They will be applied to the Minecraft artifact.
    // The access transformer file can be anywhere in the project.
    // However, it must be at "META-INF/accesstransformer.cfg" in the final mod jar to be loaded by Forge.
    // This default location is a best practice to automatically put the file in the right place in the final jar.
    // See https://docs.minecraftforge.net/en/latest/advanced/accesstransformers/ for more information.
    // accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        // applies to all the run configs below
        configureEach {
            args '-mixin.config', 'coraline.mixins.json'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${layout.buildDirectory.get().asFile}/createSrgToMcp/output.srg"
            workingDirectory project.file('run')

            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            property 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            if (project.hasProperty('scoldingAudioCheck')) {
                property 'coraline.scoldingAudioCheck', 'true'
                if (project.hasProperty('scoldingFlowStart')) property 'coraline.scoldingFlowStart', project.property('scoldingFlowStart')
                workingDirectory project.file('run-new-activities')
                args '--quickPlaySingleplayer', 'CoralineActivitiesQA'
            }
            if (project.hasProperty('secretsAudioCheck')) {
                property 'coraline.secretsAudioCheck', 'true'
                if (project.hasProperty('secretsUiCheck')) property 'coraline.secretsUiCheck', 'true'
                workingDirectory project.file('run-new-activities')
                args '--quickPlaySingleplayer', 'CoralineActivitiesQA'
            }
            if (project.hasProperty('secretsVisualCheck')) {
                property 'coraline.secretsVisualCheck', 'true'
                workingDirectory project.file('run-new-activities')
                args '--quickPlaySingleplayer', 'CoralineActivitiesQA'
            }
            if (project.hasProperty('dropperVisualCheck')) {
                property 'coraline.dropperVisualCheck', 'true'
                if (project.hasProperty('dropperOnly')) property 'coraline.dropperOnly', 'true'
                property 'coraline.revisionVisualCheck', 'true'
                workingDirectory project.file('run-new-activities')
                args '--quickPlaySingleplayer', 'CoralineActivitiesQA'
            }
            if (project.hasProperty('activityRevisionVisualCheck')) {
                property 'coraline.activityRevisionVisualCheck', 'true'
                property 'coraline.revisionVisualCheck', 'true'
                workingDirectory project.file('run-new-activities')
                args '--quickPlaySingleplayer', 'CoralineActivitiesQA'
            }
            if (project.hasProperty('visitGiftVisualCheck')) {
                property 'coraline.visitGiftVisualCheck', 'true'
                property 'coraline.revisionVisualCheck', 'true'
                workingDirectory project.file('run-new-activities')
                args '--quickPlaySingleplayer', 'CoralineActivitiesQA'
            }
            if (project.hasProperty('revisionVisualCheck')) {
                property 'coraline.revisionVisualCheck', 'true'
                if (project.hasProperty('introFortressVisualCheck')) property 'coraline.introFortressVisualCheck', 'true'
                workingDirectory project.file('run-new-activities')
                args '--quickPlaySingleplayer', 'CoralineActivitiesQA'
            }
            if (project.hasProperty('mallBattleHuntVisualCheck')) {
                property 'coraline.mallBattleHuntVisualCheck', 'true'
                if (project.hasProperty('snowBattleOnly')) property 'coraline.snowBattleOnly', 'true'
                workingDirectory project.file('run-new-activities')
                args '--quickPlaySingleplayer', 'CoralineActivitiesQA'
            }
            if (project.hasProperty('expeditionVisualCheck')) {
                property 'coraline.expeditionVisualCheck', 'true'
                workingDirectory project.file('run-new-activities')
                args '--quickPlaySingleplayer', 'CoralineActivitiesQA'
            }
            if (project.hasProperty('newActivitiesVisualCheck')) {
                property 'coraline.newActivitiesVisualCheck', 'true'
                workingDirectory project.file('run-new-activities')
                args '--quickPlaySingleplayer', 'CoralineActivitiesQA'
            }
            if (project.hasProperty('storyPresentationCheck')) {
                property 'coraline.storyPresentationCheck', 'true'
                args '--quickPlaySingleplayer', 'CoralineVisualQA170'
            }
            if (project.hasProperty('clothingVisualCheck')) {
                property 'coraline.clothingVisualCheck', 'true'
                if (project.hasProperty('referenceArmorOnly')) property 'coraline.referenceArmorOnly', 'true'
                if (project.hasProperty('effectsOnly')) property 'coraline.effectsOnly', 'true'
                args '--quickPlaySingleplayer', 'CoralineVisualQA170'
            }
            if (project.hasProperty('feastVisualCheck')) {
                property 'coraline.feastVisualCheck', 'true'
                args '--quickPlaySingleplayer', 'CoralineVisualQA170'
            }
            if (project.hasProperty('worldVisualCheck')) {
                property 'coraline.worldVisualCheck', 'true'
                args '--quickPlaySingleplayer', 'CoralineVisualQA170'
            }
            if (project.hasProperty('villageVisualCheck')) {
                property 'coraline.villageVisualCheck', 'true'
                args '--quickPlaySingleplayer', 'CoralineVisualQA170'
            }
            if (project.hasProperty('archeryVisualCheck')) {
                property 'coraline.archeryVisualCheck', 'true'
                args '--quickPlaySingleplayer', 'CoralineVisualQA170'
            }
            if (project.hasProperty('cakeVisualCheck')) {
                property 'coraline.cakeVisualCheck', 'true'
                args '--quickPlaySingleplayer', 'CoralineVisualQA170'
            }
            if (project.hasProperty('carnivalVisualCheck')) {
                property 'coraline.carnivalVisualCheck', 'true'
                args '--quickPlaySingleplayer', 'CoralineVisualQA170'
            }
            if (project.hasProperty('dreamParkourVisualCheck')) {
                property 'coraline.dreamParkourVisualCheck', 'true'
                args '--quickPlaySingleplayer', (project.findProperty('dreamParkourWorld') ?: 'CoralineDreamQA2')
            }
            if (project.hasProperty('fishingVisualCheck')) {
                property 'coraline.fishingVisualCheck', 'true'
                args '--quickPlaySingleplayer', (project.findProperty('fishingWorld') ?: 'CoralineFishingQA1')
            }
            if (project.hasProperty('gardenMazeVisualCheck')) {
                property 'coraline.gardenMazeVisualCheck', 'true'
                args '--quickPlaySingleplayer', (project.findProperty('gardenMazeWorld') ?: 'CoralineVisualQA170')
            }
            if (project.hasProperty('grandFeastVisualCheck')) {
                property 'coraline.grandFeastVisualCheck', 'true'
                args '--quickPlaySingleplayer', (project.findProperty('grandFeastWorld') ?: 'CoralineVisualQA170')
            }
            if (project.hasProperty('iceBoatRaceVisualCheck')) {
                property 'coraline.iceBoatRaceVisualCheck', 'true'
                args '--quickPlaySingleplayer', (project.findProperty('iceBoatRaceWorld') ?: 'CoralineVisualQA170')
            }
            if (project.hasProperty('magicActivitiesVisualCheck')) {
                property 'coraline.magicActivitiesVisualCheck', 'true'
                args '--quickPlaySingleplayer', (project.findProperty('magicActivitiesWorld') ?: 'CoralineVisualQA170')
            }
            if (project.hasProperty('debugVisitCheck')) {
                property 'coraline.debugVisitCheck', 'true'
                args '--quickPlaySingleplayer', 'CoralineVisualQA170'
            }
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            if (project.hasProperty('freshGameTests')) workingDirectory project.file('run-tests-' + System.currentTimeMillis())
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            // example of overriding the workingDirectory set in configureEach above
            workingDirectory project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

// Opt-in regression worlds are excluded from release jars.
if (project.hasProperty('gameTests')) {
    if (project.hasProperty('visitGiftTests')) { sourceSets.main.java.srcDir 'src/visittest/java'; sourceSets.main.java.srcDir 'src/gametest/java/com/coraline/welcome' }
    sourceSets.main.java.srcDir project.hasProperty('secretsTests') ? 'src/activitytest/java/com/coraline/secrets' : project.hasProperty('activityFixTests') ? 'src/activitytest/java' : project.hasProperty('welcomeTests') ? 'src/gametest/java/com/coraline/welcome' : project.hasProperty('familyResetTests') ? 'src/gametest/java/com/coraline/reset' : project.hasProperty('clothingTests') ? 'src/gametest/java/com/coraline/clothing' : 'src/gametest/java'
    sourceSets.main.resources.srcDir 'src/gametest/resources'
    if (project.hasProperty('parentTests')) sourceSets.main.java.srcDir 'src/gametest/java/com/coraline/parents'
}
if (project.hasProperty('renderChecks')) {
    sourceSets.main.java.srcDir 'src/rendercheck/java'
    if (project.hasProperty('iceBoatRaceVisualCheck') || project.hasProperty('magicActivitiesVisualCheck') || project.hasProperty('newActivitiesVisualCheck') || project.hasProperty('expeditionVisualCheck') || project.hasProperty('mallBattleHuntVisualCheck')) sourceSets.main.java.exclude 'com/coraline/client/DollRenderCheck.java'
}

tasks.register('importParentVoices', Exec) {
    onlyIf {
        fileTree('voicelines').files.any { f ->
            f.name.toLowerCase() ==~ /^(angryparent|mom|mother|dad|father|parent).*\.(wav|ogg|mp3|flac|m4a)$/ ||
            f.parentFile.name.toLowerCase() in ['mom','mother','dad','father']
        }
    }
    commandLine 'python', 'tools/import_parent_voices.py'
}
tasks.named('processResources').configure { dependsOn 'importParentVoices' }
tasks.register('importGameAudio', Exec) {
    dependsOn 'importParentVoices'
    commandLine 'python', 'tools/import_game_audio.py'
}
tasks.named('processResources').configure { dependsOn 'importGameAudio' }
tasks.register('importVisitAudio', Exec) {
    dependsOn 'importGameAudio'
    commandLine 'python', 'tools/import_visit_audio.py'
}
tasks.named('processResources').configure { dependsOn 'importVisitAudio' }

tasks.register('importWelcomeAudio', Exec) {
    dependsOn 'importVisitAudio'
    commandLine 'python', 'tools/import_welcome_audio.py'
}
tasks.named('processResources').configure { dependsOn 'importWelcomeAudio' }
tasks.register('importLootAudio', Exec) {
    dependsOn 'importWelcomeAudio'
    environment 'CORALINE_VOICE_MANIFEST', 'tools/other_mother_loot.json'
    commandLine 'python', 'tools/import_welcome_audio.py'
}
tasks.named('processResources').configure { dependsOn 'importLootAudio' }
tasks.register('importVisitGiftAudio', Exec) {
    dependsOn 'importLootAudio'
    environment 'CORALINE_VOICE_MANIFEST', 'tools/other_mother_visit_gifts.json'
    commandLine 'python', 'tools/import_welcome_audio.py'
}
tasks.named('processResources').configure { dependsOn 'importVisitGiftAudio' }
tasks.register('importTutorialAudio', Exec) {
    dependsOn 'importVisitGiftAudio'
    environment 'CORALINE_VOICE_MANIFEST', 'tools/other_mother_tutorial.json'
    commandLine 'python', 'tools/import_welcome_audio.py'
}
tasks.named('processResources').configure { dependsOn 'importTutorialAudio' }
tasks.register('importActivityAudio', Exec) {
    dependsOn 'importTutorialAudio'
    environment 'CORALINE_VOICE_MANIFEST', 'tools/other_mother_activities.json'
    commandLine 'python', 'tools/import_welcome_audio.py'
}
tasks.register('importArrivalAudio', Exec) {
    dependsOn 'importActivityAudio'
    environment 'CORALINE_VOICE_MANIFEST', 'tools/other_mother_arrivals.json'
    commandLine 'python', 'tools/import_welcome_audio.py'
}
tasks.register('importActivityCompleteAudio', Exec) {
    dependsOn 'importArrivalAudio'
    environment 'CORALINE_VOICE_MANIFEST', 'tools/other_mother_activity_complete.json'
    commandLine 'python', 'tools/import_welcome_audio.py'
}
tasks.register('importOtherFatherActivityIntros', Exec) {
    dependsOn 'importActivityCompleteAudio'
    environment 'CORALINE_VOICE_MANIFEST', 'tools/other_father_activity_intros.json'
    commandLine 'python', 'tools/import_welcome_audio.py'
}
tasks.register('buildStorySubtitles', Exec) {
    dependsOn 'importOtherFatherActivityIntros'
    commandLine 'python', 'tools/build_story_subtitles.py'
}
tasks.register('importSecretsAudio', Exec) {
    dependsOn 'importOtherFatherActivityIntros'
    environment 'CORALINE_VOICE_MANIFEST', 'tools/other_mother_secrets.json'
    commandLine 'python', 'tools/import_welcome_audio.py'
}
tasks.register('importScoldingAudio', Exec) {
    dependsOn 'importSecretsAudio'
    environment 'CORALINE_VOICE_MANIFEST', 'tools/other_mother_scolding.json'
    commandLine 'python', 'tools/import_welcome_audio.py'
}
tasks.named('buildStorySubtitles').configure { dependsOn 'importScoldingAudio' }
tasks.named('processResources').configure { dependsOn 'buildStorySubtitles' }

repositories {
    // Put repositories for dependencies here
    // ForgeGradle automatically adds the Forge maven and Maven Central for you

    // If you have mod jar dependencies in ./libs, you can declare them as a repository like so.
    // See https://docs.gradle.org/current/userguide/declaring_repositories.html#sub:flat_dir_resolver
    // flatDir {
    //     dir 'libs'
    // }
}

dependencies {
    annotationProcessor 'org.spongepowered:mixin:0.8.5'
    annotationProcessor 'com.google.code.gson:gson:2.10'
    annotationProcessor 'com.google.guava:guava:31.1-jre'
    annotationProcessor 'org.ow2.asm:asm-tree:9.5'
    // Specify the version of Minecraft to use.
    // Any artifact can be supplied so long as it has a "userdev" classifier artifact and is a compatible patcher artifact.
    // The "userdev" classifier will be requested and setup by ForgeGradle.
    // If the group id is "net.minecraft" and the artifact id is one of ["client", "server", "joined"],
    // then special handling is done to allow a setup of a vanilla dependency without the use of an external repository.
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Example mod dependency with JEI - using fg.deobf() ensures the dependency is remapped to your development mappings
    // The JEI API is declared for compile time use, while the full JEI artifact is used at runtime
    // compileOnly fg.deobf("mezz.jei:jei-${mc_version}-common-api:${jei_version}")
    // compileOnly fg.deobf("mezz.jei:jei-${mc_version}-forge-api:${jei_version}")
    // runtimeOnly fg.deobf("mezz.jei:jei-${mc_version}-forge:${jei_version}")

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation fg.deobf("blank:coolmod-${mc_version}:${coolmod_version}")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
// When "copyIdeResources" is enabled, this will also run before the game launches in IDE environments.
// See https://docs.gradle.org/current/dsl/org.gradle.language.jvm.tasks.ProcessResources.html
tasks.named('processResources', ProcessResources).configure {
    inputs.file('tools/optimize_runtime_assets.py')
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
    // Optimize COPIED runtime resources, leaving original artwork/audio untouched.
    // Copy all inputs again on rerun: sound aliases must start from the source manifest.
    doLast {
        project.exec {
            commandLine 'python', 'tools/optimize_runtime_assets.py',
                '--resources', destinationDir.absolutePath,
                '--cache', layout.buildDirectory.dir('asset-optimization-cache').get().asFile.absolutePath,
                '--report', layout.buildDirectory.file('reports/asset-size.json').get().asFile.absolutePath
        }
    }
}

tasks.register('testRuntimeAssetOptimization', Exec) {
    commandLine 'python', 'tools/test_optimize_runtime_assets.py'
}
tasks.named('check').configure { dependsOn 'testRuntimeAssetOptimization' }

// Example for how to get properties into the manifest for reading at runtime.
tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'MixinConfigs'            : 'coraline.mixins.json',
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1', // We are version 1 of ourselves
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }

    // This is the preferred method to reobfuscate your jar file
    finalizedBy 'reobfJar'
}

// However if you are in a multi-project build, dev time needs unobfed jar files, so you can delay the obfuscation until publishing by doing:
// tasks.named('publish').configure {
//     dependsOn 'reobfJar'
// }

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

def clothingRefmap = layout.buildDirectory.file('generated/mixin/coraline.refmap.json')
def clothingMappings = layout.buildDirectory.file('generatedMappings/clothing.srg')
tasks.register('clothingSrgMappings') {
    dependsOn 'createMcpToSrg'
    inputs.file(layout.buildDirectory.file('createMcpToSrg/output.tsrg'))
    outputs.file(clothingMappings)
    doLast {
        clothingMappings.get().asFile.parentFile.mkdirs()
        net.minecraftforge.srgutils.IMappingFile.load(layout.buildDirectory.file('createMcpToSrg/output.tsrg').get().asFile)
            .write(clothingMappings.get().asFile.toPath(), net.minecraftforge.srgutils.IMappingFile.Format.SRG, false)
    }
}
sourceSets.main.resources.srcDir(layout.buildDirectory.dir('generated/mixin'))
tasks.named('compileJava', JavaCompile).configure {
    // Opt-in test sources share main output. Force a full compilation when switching
    // source sets; incremental annotation processing can otherwise remove test classes.
    if (project.hasProperty('gameTests')) options.incremental = false
    dependsOn 'clothingSrgMappings'
    doFirst { clothingRefmap.get().asFile.parentFile.mkdirs() }
    options.compilerArgs += [
        '-AdefaultObfuscationEnv=searge',
        "-AreobfSrgFile=${clothingMappings.get().asFile}",
        "-AoutRefMapFile=${clothingRefmap.get().asFile}"
    ]
}
tasks.named('processResources').configure { dependsOn 'compileJava' }

// Minecraft reports malformed model JSON only when the client loads resources.
// Validate it during the normal build so broken carnival tools are caught sooner.
tasks.register('validateModelJson') {
    def models = fileTree('src/main/resources/assets/coraline/models') { include '**/*.json' }
    inputs.files(models)
    doLast {
        def parser = new groovy.json.JsonSlurper()
        models.each { model ->
            try { parser.parse(model) }
            catch (Exception ex) { throw new GradleException("Invalid model JSON: ${model}", ex) }
        }
    }
}
tasks.named('check').configure { dependsOn 'validateModelJson' }
if (project.hasProperty('activityFixTests')) {
    tasks.matching { it.name == 'runGameTestServer' }.configureEach {
        doFirst {
            if (!layout.buildDirectory.file('classes/java/main/com/coraline/feast/ActivityFixGameTests.class').get().asFile.exists())
                throw new GradleException('Activity regression test classes are missing; refusing a zero-test run.')
        }
    }
}
